name: deploy

on:
  push:
    branches: [main]

concurrency:
  group: cailyx-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        svc: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.svc }}
          push: true
          tags: |
            ghcr.io/rothenhall/cailyx-${{ matrix.svc }}:latest
            ghcr.io/rothenhall/cailyx-${{ matrix.svc }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  rollout:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to droplet over SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.DROPLET_HOST }}
          SSH_USER: ${{ secrets.DROPLET_USER }}
        run: |
          test -n "$SSH_KEY" || { echo "::error::SSH_PRIVATE_KEY secret is not set (repo Settings → Secrets → Actions)"; exit 1; }
          test -n "$HOST" || { echo "::error::DROPLET_HOST secret is not set"; exit 1; }
          test -n "$SSH_USER" || { echo "::error::DROPLET_USER secret is not set"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$SSH_USER@$HOST" "git -C /opt/cailyx fetch origin && git -C /opt/cailyx reset --hard origin/main && bash /opt/cailyx/deploy-remote.sh"
